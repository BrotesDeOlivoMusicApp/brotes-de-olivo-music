name: Importar 31 acordes aprobados
on:
  push:
    branches: [main]
    paths:
      - 'scripts/import_chords_batch3_20260930.py'
      - '.github/workflows/import-chords-batch3.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/import_chords_batch3_20260930.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json
          git commit -m "[ChatGPT] Importa lote de 31 acordes aprobados"
          git push
