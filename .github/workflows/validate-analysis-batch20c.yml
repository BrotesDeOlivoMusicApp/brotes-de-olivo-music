name: Validar bloque análisis 20C
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch20c_candidates.json'
      - 'scripts/validate_analysis_batch20c.py'
      - '.github/workflows/validate-analysis-batch20c.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch20c.py
