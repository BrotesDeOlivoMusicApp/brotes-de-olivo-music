name: Extraer letras bloque análisis 20E
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_analysis_batch20e.py'
      - '.github/workflows/extract-analysis-batch20e.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/extract_analysis_batch20e.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch20e_lyrics.json
          git commit -m "[ChatGPT] Extrae letras V11 bloque análisis 20E" || exit 0
          git push
