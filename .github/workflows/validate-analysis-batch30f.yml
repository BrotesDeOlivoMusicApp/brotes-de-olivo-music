name: Validar bloque análisis 30F
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch30f_candidates.json'
      - 'scripts/validate_analysis_batch30f.py'
      - '.github/workflows/validate-analysis-batch30f.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch30f.py
