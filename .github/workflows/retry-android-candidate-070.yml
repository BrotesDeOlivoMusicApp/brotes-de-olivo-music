name: Upload verified Android 0.0.70 candidate
on:
  push:
    paths:
      - '.github/workflows/retry-android-candidate-070.yml'
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and verify previously compiled APK
        env:
          ARCHIVE_URL: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-c6d4-8210-843f-2ed593e86d9b/raw?se=2026-10-11T19%3A20%3A27Z&sp=r&sv=2026-02-06&sr=b&scid=31f7ee24-c6d0-52d3-a723-180292ba89dc&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-10T23%3A22%3A38Z&ske=2026-10-11T23%3A22%3A38Z&sks=b&skv=2026-02-06&sig=UYCFiWkux7PKwIYP5Jn0IY/LgpwKIwxispxgvKwDX80%3D"
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 2 --max-time 120 "$ARCHIVE_URL" -o /tmp/candidate.zip
          mkdir -p candidate
          unzip -q /tmp/candidate.zip -d candidate
          echo '80ecb726d2a8f9178334c723cc322507383d806b254a3fe18b85f2e5b06f25f7  candidate/BrotesDeOlivo-Android-v0.0.70.apk' | sha256sum --check
          jq -e '.version=="0.0.70" and .sha256=="80ecb726d2a8f9178334c723cc322507383d806b254a3fe18b85f2e5b06f25f7" and .validation_level=="rapid" and .unit_tests_executed==true' candidate/BrotesDeOlivo-Android-v0.0.70.json
      - name: Upload to Android candidate Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view android-candidate --repo BrotesDeOlivoMusicApp/brotes-de-olivo-music
          gh release upload android-candidate candidate/BrotesDeOlivo-Android-v0.0.70.apk candidate/BrotesDeOlivo-Android-v0.0.70.json --repo BrotesDeOlivoMusicApp/brotes-de-olivo-music --clobber
          gh release view android-candidate --repo BrotesDeOlivoMusicApp/brotes-de-olivo-music --json assets --jq '.assets[].name' | grep -Fx 'BrotesDeOlivo-Android-v0.0.70.apk'
