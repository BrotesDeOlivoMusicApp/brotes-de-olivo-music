name: Validar catálogo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validar-catalogo:
    name: Validar catalogo.json
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Comprobar JSON válido
        run: python -m json.tool catalogo.json > /dev/null

      - name: Instalar validador
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Validar contra el esquema
        run: python -m jsonschema --instance catalogo.json schema/catalogo.schema.json
