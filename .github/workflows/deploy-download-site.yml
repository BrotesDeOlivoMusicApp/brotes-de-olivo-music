name: Publish download site

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "downloads/**"
      - ".github/workflows/deploy-download-site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare self-contained site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/downloads
          cp -R website/. site/
          cp downloads/manifest.json site/downloads/manifest.json

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
