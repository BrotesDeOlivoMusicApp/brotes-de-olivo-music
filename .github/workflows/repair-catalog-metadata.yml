name: Reparar version interna del catalogo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_catalog_metadata.py'
      - '.github/workflows/repair-catalog-metadata.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/repair_catalog_metadata.py
      - shell: bash
        run: |
          set -e
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json

          if git diff --cached --quiet; then
            echo "Catalog metadata already synchronized."
            exit 0
          fi

          git commit -m "[ChatGPT] Repara data_version interno del catalogo"

          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push concurrente fallido, reintentando ($attempt/6)..."
            sleep 2
          done

          echo "No se pudo publicar la reparación tras 6 intentos."
          exit 1
