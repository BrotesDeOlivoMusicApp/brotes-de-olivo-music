name: Reparar version interna del catalogo
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_catalog_metadata.py'
      - '.github/workflows/repair-catalog-metadata.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/repair_catalog_metadata.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json
          if git diff --cached --quiet; then
            echo "Catalog metadata already synchronized."
          else
            git commit -m "[ChatGPT] Repara data_version interno del catalogo"
            git push
          fi
