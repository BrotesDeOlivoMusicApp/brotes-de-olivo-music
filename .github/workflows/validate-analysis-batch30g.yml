name: Validar bloque análisis 30G
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch30g_candidates.json'
      - 'scripts/validate_analysis_batch30g.py'
      - '.github/workflows/validate-analysis-batch30g.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch30g.py
