name: Generar candidatos bloque análisis 5
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analysis_batch5.py'
      - '.github/workflows/generate-analysis-batch5.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_analysis_batch5.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch5_candidates.json
          git commit -m "[ChatGPT] Genera candidatos bloque análisis 5" || exit 0
          git push
