name: Registrar estadisticas GitHub

on:
  schedule:
    - cron: '27 3 * * *'
  workflow_dispatch:

# Unica tarea automatica: consulta metadatos y registra JSON en rama aislada.
# No compila, publica, despliega, sincroniza ni modifica bases de datos.
permissions:
  contents: write
  actions: read

concurrency:
  group: github-statistics-history
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Obtener estadisticas mediante API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_STATS_TRAFFIC_TOKEN: ${{ secrets.GITHUB_STATS_TRAFFIC_TOKEN }}
          GITHUB_STATS_TRACKED_FILES: 'data/brotes_publica.sqlite,downloads/manifest.json,catalogo.json'
        run: |
          set -euo pipefail
          python3 .github/scripts/collect-github-statistics.py "$RUNNER_TEMP/github-statistics.json"

      - name: Conservar historico fuera de main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="github-statistics"
          worktree="$RUNNER_TEMP/metrics-history"
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
          git worktree add --detach "$worktree" "refs/remotes/origin/$branch"
          day="$(date -u +%Y-%m-%d)"
          month="$(date -u +%Y-%m)"
          mkdir -p "$worktree/snapshots/$month"
          cp "$RUNNER_TEMP/github-statistics.json" "$worktree/snapshots/$month/$day.json"
          git -C "$worktree" add "snapshots/$month/$day.json"
          if git -C "$worktree" diff --cached --quiet; then
            echo "Sin cambios en el historico"
            exit 0
          fi
          git -C "$worktree" commit -m "stats: snapshot UTC $day [skip ci]"
          git -C "$worktree" push origin "HEAD:refs/heads/$branch"
