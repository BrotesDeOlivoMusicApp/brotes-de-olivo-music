name: Generar candidatos bloque análisis 4
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analysis_batch4.py'
      - '.github/workflows/generate-analysis-batch4.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_analysis_batch4.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch4_candidates.json
          git commit -m "[ChatGPT] Genera candidatos bloque análisis 4" || exit 0
          git push
