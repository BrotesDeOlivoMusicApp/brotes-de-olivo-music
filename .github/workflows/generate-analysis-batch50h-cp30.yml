name: Generar candidatos checkpoint 30 bloque 50H
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analysis_batch50h_cp30.py'
      - 'scripts/analysis_batch50h_lyrics.json'
      - '.github/workflows/generate-analysis-batch50h-cp30.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_analysis_batch50h_cp30.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch50h_cp30_candidates.json
          git commit -m "[ChatGPT] Genera candidatos checkpoint 30 bloque 50H" || exit 0
          git push
