name: Validar bloque análisis 3
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch3_candidates.json'
      - 'scripts/validate_analysis_batch3.py'
      - '.github/workflows/validate-analysis-batch3.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch3.py
