name: Upload verified Play bundle 0.0.70
on:
  push:
    paths:
      - '.github/workflows/upload-android-play-v070.yml'

permissions:
  contents: write

jobs:
  upload-play:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve and validate signed AAB and mapping from successful extended CI
        shell: bash
        env:
          ZIP_URL: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-f8a0-81f4-b191-bec25128cc43/raw?se=2026-10-11T19%3A47%3A06Z&sp=r&sv=2026-02-06&sr=b&scid=1918bfc5-cb67-5699-a721-cc52057cdbfc&skoid=a4604a88-85e4-4562-b6ab-a5622268de80&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-11T08%3A49%3A29Z&ske=2026-10-12T08%3A49%3A29Z&sks=b&skv=2026-02-06&sig=3KLWzo/PWu6ak8bGDAyQ774qC/fVPCurdQ/7kLFC0wQ%3D"
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 150 "$ZIP_URL" -o /tmp/brotes-play.zip
          mkdir -p play
          unzip -q /tmp/brotes-play.zip -d play
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          d=Path('play')
          m=json.loads((d/'BrotesDeOlivo-Android-v0.0.70-Play.json').read_text())
          assert m['version']=='0.0.70' and m['version_code']==70
          assert m['file']=='BrotesDeOlivo-Android-v0.0.70-Play.aab'
          assert m['source_commit']=='3c52ef4210a530b85d44f6ed8d36c0126a672ce4'
          assert m['validation_level']=='extended'
          assert hashlib.sha256((d/m['file']).read_bytes()).hexdigest()=='eaf82d0b1e3c0e453f9e449fbea3a3f9a88d70ca20d690d36092c82e758c5335'==m['sha256']
          assert (d/'BrotesDeOlivo-Android-v0.0.70-mapping.txt').stat().st_size > 1024
          print('Extended-validated AAB 0.0.70, SHA-256 and R8 mapping verified')
          PY
          jarsigner -verify play/BrotesDeOlivo-Android-v0.0.70-Play.aab | grep -q 'jar verified'
          unzip -t play/BrotesDeOlivo-Android-v0.0.70-Play.aab >/dev/null
      - name: Publish AAB, manifest and mapping to Play Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='BrotesDeOlivoMusicApp/brotes-de-olivo-music'
          gh release view android-play --repo "$repo"
          gh release upload android-play \
            play/BrotesDeOlivo-Android-v0.0.70-Play.aab \
            play/BrotesDeOlivo-Android-v0.0.70-Play.json \
            play/BrotesDeOlivo-Android-v0.0.70-mapping.txt \
            --repo "$repo" --clobber
          gh release upload android-candidate \
            play/BrotesDeOlivo-Android-v0.0.70-Play.aab \
            play/BrotesDeOlivo-Android-v0.0.70-Play.json \
            --repo "$repo" --clobber
          gh release view android-play --repo "$repo" --json assets --jq '.assets[].name' | grep -Fx 'BrotesDeOlivo-Android-v0.0.70-Play.aab'
          gh release view android-play --repo "$repo" --json assets --jq '.assets[].name' | grep -Fx 'BrotesDeOlivo-Android-v0.0.70-mapping.txt'
      - name: Keep at most three latest candidate application versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo='BrotesDeOlivoMusicApp/brotes-de-olivo-music'
          gh api "repos/$repo/releases/tags/android-candidate" > /tmp/candidate-release.json
          python3 - <<'PY' > /tmp/candidate-old-asset-ids
          import json,re
          r=json.load(open('/tmp/candidate-release.json'))
          grouped={}
          for a in r['assets']:
              match=re.match(r'^BrotesDeOlivo-Android-v(\d+\.\d+\.\d+)(?:-|\.)', a['name'])
              if match:
                  grouped.setdefault(tuple(map(int,match.group(1).split('.'))), []).append(a)
          retain=set(sorted(grouped,reverse=True)[:3])
          for version,assets in grouped.items():
              if version not in retain:
                  for a in assets:
                      print(a['id'])
          PY
          while read -r asset_id; do
            test -n "$asset_id" || continue
            gh api -X DELETE "repos/$repo/releases/assets/$asset_id"
          done < /tmp/candidate-old-asset-ids
