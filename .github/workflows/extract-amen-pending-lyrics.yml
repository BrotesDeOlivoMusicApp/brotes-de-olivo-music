name: Extraer letras AMEN pendientes
on:
  push:
    branches: [main]
    paths:
      - 'scripts/extract_amen_pending_lyrics.py'
      - '.github/workflows/extract-amen-pending-lyrics.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/extract_amen_pending_lyrics.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/amen_pending_lyrics.json
          git commit -m "[ChatGPT] Extrae letras V11 pendientes de AMEN"
          git push
