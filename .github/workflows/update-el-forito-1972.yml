name: Actualizar El Forito 1972
on:
  push:
    branches: [ main ]
    paths:
      - "scripts/apply_el_forito_1972.py"
      - ".github/workflows/update-el-forito-1972.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-el-forito-1972
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/apply_el_forito_1972.py
      - name: Validar
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("data/brotes_publica.sqlite")
          row=db.execute("SELECT anio,observaciones FROM disco WHERE disco_id='D011'").fetchone()
          assert row[0]==1972 and "Single independiente" in row[1]
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          print("D011 distribución OK")
          PY
      - name: Guardar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Corrige El Forito a 1972"
          git fetch origin main
          git rebase origin/main
          git push origin main
