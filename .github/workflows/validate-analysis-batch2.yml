name: Validar bloque análisis 2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch2_candidates.json'
      - 'scripts/validate_analysis_batch2.py'
      - '.github/workflows/validate-analysis-batch2.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch2.py
