name: Actualizar metadatos confirmados 2026-09-25
on:
  push:
    branches: [ main ]
    paths:
      - "scripts/apply_confirmed_metadata_20260925.py"
      - ".github/workflows/update-confirmed-metadata-20260925.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-confirmed-metadata-20260925
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/apply_confirmed_metadata_20260925.py
      - name: Validar
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("data/brotes_publica.sqlite")
          assert db.execute("SELECT url_apple_music FROM disco WHERE disco_id='D001'").fetchone()[0] == "https://music.apple.com/es/album/allanad-los-caminos-single/1498042138"
          assert db.execute("SELECT url_apple_music FROM disco WHERE disco_id='D011'").fetchone()[0] == "https://music.apple.com/mx/album/el-forito-single/1497856151"
          assert db.execute("SELECT url_apple_music FROM disco WHERE disco_id='D026'").fetchone()[0] == "https://music.apple.com/us/album/sinfon%C3%ADa-de-las-vocales-single/1497729736"
          assert db.execute("SELECT url_deezer FROM disco WHERE disco_id='D032'").fetchone()[0] == "https://www.deezer.com/es/album/923416031"
          assert db.execute("SELECT COUNT(*) FROM cancion WHERE disco_id IN ('D029','D030') AND duracion_segundos IS NULL").fetchone()[0] == 0
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          print("Validación distribución OK")
          PY
      - name: Guardar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Completa enlaces y duraciones confirmadas"
          git fetch origin main
          git rebase origin/main
          git push origin main
