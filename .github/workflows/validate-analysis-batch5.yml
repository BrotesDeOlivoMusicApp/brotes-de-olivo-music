name: Validar bloque análisis 5
on:
  push:
    branches: [main]
    paths:
      - 'scripts/analysis_batch5_candidates.json'
      - 'scripts/validate_analysis_batch5.py'
      - '.github/workflows/validate-analysis-batch5.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_analysis_batch5.py
