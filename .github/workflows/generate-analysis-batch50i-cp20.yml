name: Generar candidatos checkpoint 20 bloque 50I
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analysis_batch50i_cp20.py'
      - 'scripts/analysis_batch50i_cp20_lyrics.json'
      - '.github/workflows/generate-analysis-batch50i-cp20.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_analysis_batch50i_cp20.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch50i_cp20_candidates.json
          git commit -m "[ChatGPT] Genera candidatos checkpoint 20 bloque 50I" || exit 0
          git push
