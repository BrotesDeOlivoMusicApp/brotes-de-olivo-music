name: Actualizar códigos Creo en Ti
on:
  push:
    branches: [ main ]
    paths:
      - "scripts/apply_creo_en_ti_codes.py"
      - ".github/workflows/update-creo-en-ti-codes.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-creo-en-ti-codes
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/apply_creo_en_ti_codes.py
      - name: Validar
        run: |
          python - <<'PY'
          import sqlite3
          db=sqlite3.connect("data/brotes_publica.sqlite")
          assert db.execute("SELECT upc_ean,referencia FROM disco WHERE disco_id='D005'").fetchone()==("8433391982761","CUP2016617")
          assert db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"
          assert not db.execute("PRAGMA foreign_key_check").fetchall()
          print("D005 distribución OK")
          PY
      - name: Guardar
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brotes_publica.sqlite data/version.json
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Completa códigos de Creo en Ti"
          git fetch origin main
          git rebase origin/main
          git push origin main
