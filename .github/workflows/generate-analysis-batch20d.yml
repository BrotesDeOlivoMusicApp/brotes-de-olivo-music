name: Generar candidatos bloque análisis 20D
on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_analysis_batch20d.py'
      - 'scripts/analysis_batch20d_lyrics.json'
      - '.github/workflows/generate-analysis-batch20d.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/generate_analysis_batch20d.py
      - run: |
          git config user.name "ChatGPT"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/analysis_batch20d_candidates.json
          git commit -m "[ChatGPT] Genera candidatos bloque análisis 20D" || exit 0
          git push
